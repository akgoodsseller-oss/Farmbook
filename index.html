<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>FarmBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --white:#ffffff; --bg:#f7f8f5; --card:#ffffff; --ink:#23261f; --muted:#7b8074; --line:#e7eae1;
  --green:#1f8a4c; --green-d:#166b3a; --green-l:#e8f5ec;
  --orange:#f07d10; --orange-d:#d06a06; --orange-l:#fef0e0;
  --red:#cf3b22; --red-l:#fce8e3; --blue:#2f6fb0; --plum:#9c3587;
  --sh:0 1px 2px rgba(35,38,31,.05),0 6px 18px rgba(35,38,31,.06);
  --sh2:0 10px 30px rgba(35,38,31,.14);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
@media(min-width:540px){.app{margin:16px auto;min-height:calc(100vh - 32px);border-radius:26px;overflow:hidden;box-shadow:var(--sh2)}body{background:#e9ece4}}
h1,h2,h3{margin:0;font-family:Fraunces,Georgia,serif;line-height:1.15}
.n{font-family:Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green-l);display:grid;place-items:center;font-size:17px;flex:none}
header .t{flex:1;min-width:0}
header .t b{font-family:Fraunces;font-size:17px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t span{font-size:11.5px;color:var(--muted)}
.sync{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--bg);color:var(--muted);flex:none}
.sync.on{background:var(--green-l);color:var(--green)}

main{padding:14px 14px 96px}
.pt{font-size:23px;font-weight:600;margin:2px 2px 2px}
.ps{color:var(--muted);font-size:13px;margin:0 2px 14px}
.eb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 2px 8px}

/* hero */
.hero{background:linear-gradient(145deg,var(--green),var(--green-d));color:#fff;border-radius:20px;padding:16px 18px;box-shadow:var(--sh2)}
.hero .l{font-size:12.5px;opacity:.9;font-weight:600}
.hero .v{font-size:36px;font-weight:600;margin-top:1px}
.hero .sp{height:38px;margin:2px -4px 0}
.hero .r{display:flex;gap:8px;margin-top:12px}
.hero .r>div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.hero .r b{font-family:Fraunces;font-size:17px;font-weight:600;display:block}
.hero .r span{font-size:11px;opacity:.92}

/* tiles */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);padding:13px;box-shadow:var(--sh);position:relative}
.tile .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;margin-bottom:8px}
.ic.g{background:var(--green-l);color:var(--green)} .ic.o{background:var(--orange-l);color:var(--orange-d)}
.ic.r{background:var(--red-l);color:var(--red)} .ic.b{background:#e9f1f9;color:var(--blue)}
.tile .v{font-family:Fraunces;font-size:21px;font-weight:600}
.tile .l{font-size:12px;color:var(--muted);margin-top:1px}
.tile .badge{position:absolute;top:11px;right:11px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--red-l);color:var(--red)}
.tap{cursor:pointer}

.card{background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--sh);margin-bottom:12px}
.card.pad0{padding:4px 15px}
.card h3{font-size:15.5px;font-weight:600}
.card .cs{font-size:12px;color:var(--muted);margin:2px 0 8px}
.cb{position:relative;height:168px} .cb.s{height:146px}
.cempty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:12px}

/* rows */
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:17px;flex:none}
.av.id{font-family:Figtree;font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-l);letter-spacing:-.02em}
.row .m{flex:1;min-width:0}
.row .m b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{font-size:12px;color:var(--muted)}
.row .e{text-align:right;flex:none}
.row .e b{font-family:Fraunces;font-size:15px;font-weight:600;display:block}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:20px;margin-top:2px}
.pill.new{background:var(--orange-l);color:var(--orange-d)} .pill.ok{background:var(--green-l);color:var(--green)}
.pill.late{background:var(--red-l);color:var(--red)} .pill.grey{background:var(--bg);color:var(--muted)}

/* buttons */
.b{border:0;border-radius:12px;padding:11px 15px;font-family:Figtree;font-weight:600;font-size:14px;cursor:pointer;background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.b.o{background:var(--orange);color:#fff} .b.g{background:var(--green);color:#fff}
.b.gh{background:transparent;border:1px solid var(--line)} .b.s{padding:8px 11px;font-size:12.5px}
.b.w{width:100%} .b:active{transform:scale(.985)} .b.wa{background:#25d366;color:#08341a}
.br{display:flex;gap:7px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 13px;border-radius:20px;font-weight:600;font-size:12.5px;font-family:Figtree;cursor:pointer}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}

/* forms */
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;font-family:Figtree;font-size:15px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--white);color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange-l);border-color:var(--orange)}
.two{display:flex;gap:8px}.two>*{flex:1}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);font-weight:600;margin-top:12px}
.chk input{width:auto}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.err{font-size:12px;color:var(--red);margin-top:5px;font-weight:600}
input.bad,select.bad,textarea.bad{border-color:var(--red);background:var(--red-l)}
.req{color:var(--red);font-weight:800}
.warn{background:var(--red-l);border-radius:11px;padding:9px 11px;font-size:12.5px;color:var(--red);font-weight:600;margin-top:8px}
.ib.over{border-color:var(--red);background:var(--red-l)}
.stk{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:5px}
.stk.bad{color:var(--red)}

/* empty */
.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.empty .em{font-size:40px}.empty h3{color:var(--ink);margin:8px 0 4px;font-size:17px}
.empty p{font-size:13.5px;max-width:250px;margin:0 auto 14px}

/* nav + fab */
.fab{position:fixed;bottom:76px;right:calc(50% - 230px + 16px);z-index:31;width:56px;height:56px;border-radius:18px;border:0;background:var(--orange);color:#fff;font-size:27px;box-shadow:var(--sh2);cursor:pointer;display:grid;place-items:center}
@media(max-width:539px){.fab{right:16px}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:460px;margin:0 auto;background:var(--white);border-top:1px solid var(--line);display:flex;padding:6px 2px 8px}
@media(min-width:540px){nav{border-radius:0 0 26px 26px}}
nav button{flex:1;border:0;background:none;color:var(--muted);font-family:Figtree;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--orange-d)}

/* sheet modal */
.mask{position:fixed;inset:0;background:rgba(25,28,20,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.open{display:flex}
@media(min-width:540px){.mask{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:460px;max-height:93vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 24px;animation:up .22s ease}
@media(min-width:540px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(26px);opacity:.7}to{transform:none;opacity:1}}
.sheet h2{font-size:19px;font-weight:600}
.x{float:right;border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;font-size:19px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.x:active{background:var(--line)}
.tot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.tot .n{font-size:21px;font-weight:600}
.il{display:grid;grid-template-columns:1fr 56px 66px 28px;gap:6px;align-items:center;margin-bottom:6px}
.il .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:7px;background:var(--white)}
.ib .t{display:grid;grid-template-columns:1fr 58px 28px;gap:6px;align-items:center}
.ib .p{display:grid;grid-template-columns:1fr 84px;gap:6px;align-items:center;margin-top:6px}
.ib .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib .amt{font-size:14px;font-weight:600;text-align:right}
.ib select,.ib input{font-size:12.5px;padding:8px 9px;border-radius:9px}
.pr{display:grid;grid-template-columns:1fr 82px 28px;gap:6px;align-items:center;margin-bottom:6px}
.pr input{padding:9px 10px;font-size:13.5px}
.toast{position:fixed;bottom:98px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;display:none;box-shadow:var(--sh2);max-width:88%}
.toast.on{display:block}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left}
table.tb td.r,table.tb th.r{text-align:right}
.sx{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:9px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.note{background:var(--orange-l);border-radius:11px;padding:10px 12px;font-size:12.5px;color:var(--ink)}
.sync{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sync.bad{background:var(--red-l);color:var(--red)}
.sync.ok{background:var(--green-l);color:var(--green)}
.ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-46px);z-index:70;background:var(--green);color:#fff;
  font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:0 0 14px 14px;transition:transform .18s ease;pointer-events:none}
.ptr.on{transform:translate(-50%,0)}
.rf{display:flex;align-items:center;gap:9px;background:var(--white);border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:12px}
.rf .t{flex:1;font-size:12.5px;color:var(--muted)}
.rf .t b{color:var(--ink);font-size:13.5px;display:block}
code.sn{display:block;background:#1e2119;color:#dfe6d8;padding:11px;border-radius:10px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:190px;overflow:auto;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🍊</div>
    <div class="t"><b id="hName">FarmBook</b><span id="hDate"></span></div>
    <div class="sync" id="hSync" onclick="syncNow(true)" title="Refresh from the Sheet">Offline</div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab" title="New order">＋</button>
  <nav id="nav">
    <button class="on" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>Home</button>
    <button data-v="orders"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8.5h6M9 12h6M9 15.5h4"/></svg>Orders</button>
    <button data-v="stock"><svg viewBox="0 0 24 24"><path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5 3.5 16.5z"/><path d="M3.5 7.5 12 11.5l8.5-4"/><path d="M12 11.5v9"/></svg>Stock</button>
    <button data-v="money"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 9.5h18"/><path d="M16.5 14H18"/></svg>Money</button>
    <button data-v="books"><svg viewBox="0 0 24 24"><path d="M12 6.6C10.4 5 8.4 4.5 4 4.5v13c4.4 0 6.4.5 8 2 1.6-1.5 3.6-2 8-2v-13c-4.4 0-6.4.5-8 2.1z"/><path d="M12 6.6v12.9"/></svg>Books</button>
    <button data-v="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M4.6 7.5l2.6 1.5M16.8 15l2.6 1.5M4.6 16.5l2.6-1.5M16.8 9l2.6-1.5"/></svg>Admin</button>
  </nav>
</div>
<div class="mask" id="mask"><div class="sheet" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   SHARING SET-UP  —  the only part you ever need to edit by hand.

   Do the Google Sheet set-up ONCE (Admin -> Set up my Google Sheet).
   Then open this file in Notepad, paste your /exec link between the
   quotes below, save, and send that ONE file to everybody. They just
   open it — nothing to set up on their side.

   There is only ever one file. Who did what is recorded by the
   "Sold by" name picked on each order, not by the copy of the file.
   ══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  SHEET_URL : 'https://script.google.com/macros/s/AKfycbwFRzmH9aGH2qWKR5oxBLpMNhwyBmVfOlNGKZJNFQ50h80S3LaUfTVCGNs-FQFO1MWB/exec',                 // paste your .../exec link here
  FARM_NAME : '',                 // e.g. 'Green Valley Organic Farm'
  MOBILE    : '',                 // farm contact number
  UPI       : '',                 // e.g. 'greenvalley@upi'
  LEAD_DAYS : 2                   // days from order to delivery
};

/* ═══════════════ 1. DATA ═══════════════ */
const KEY='farmbook_v1';
const BLANK={farm:{name:'',upi:'',mobile:'',leadDays:2,shipFee:0,pin:''},sheetUrl:'',customers:[],sellers:[],products:[],
  orders:[],payments:[],expenses:[],stockLogs:[],budgets:{},seq:{R:0,W:0,H:0,C:0,order:0,person:0},
  tomb:{},farmU:0,farmV:{},syncedAt:0,since:0,clean:{},cleanFarmU:-1,cleanTomb:'{}',oneTrip:null,
  tabsAt:0,tabsWaiting:false,everSynced:false,seeded:false,who:''};
/* Produce and people you start with — edit or delete them any time in Setup. */
const SEED_PRODUCTS=[
  {id:'seed-mosambi',name:'Organic Mosambi',unit:'kg',cost:0,stock:0,low:20,fresh:true,
   prices:[{label:'Retail',amt:60},{label:'Wholesale',amt:45}]},
  {id:'seed-orange', name:'Organic Orange', unit:'kg',cost:0,stock:0,low:20,fresh:true,
   prices:[{label:'Retail',amt:80},{label:'Wholesale',amt:60}]}];
const SEED_SELLERS=[{id:'seed-suresh',code:'suresh-001',name:'Suresh'},
                    {id:'seed-ramesh',code:'ramesh-002',name:'Ramesh'}];
let S=load(), V='home', charts=[];
function load(){
  let d; try{ d=Object.assign({},BLANK,JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){ d=Object.assign({},BLANK); }
  d.farm=Object.assign({},BLANK.farm,d.farm||{});
  d.stockLogs=d.stockLogs||[]; d.tomb=d.tomb||{}; d.farmU=+d.farmU||0; d.farmV=d.farmV||{};
  d.since=+d.since||0; d.clean=d.clean||{}; d.cleanFarmU=(d.cleanFarmU==null?-1:+d.cleanFarmU);
  d.cleanTomb=d.cleanTomb||'{}';
  /* older copies had a single price per produce - turn it into a price list */
  (d.products||[]).forEach(function(p){
    if(!Array.isArray(p.prices)||!p.prices.length) p.prices=[{label:'Retail',amt:Number(p.rate)||0}];
    p.rate=Number(p.prices[0].amt)||0;
    if(p.low==null) p.low=10;
  });
  /* Anything filled in at the top of this file wins on a fresh copy,
     so a shared file arrives already connected and already named. */
  if(CONFIG.SHEET_URL && !d.sheetUrl) d.sheetUrl=CONFIG.SHEET_URL.trim();
  if(CONFIG.FARM_NAME && !d.farm.name)   d.farm.name=CONFIG.FARM_NAME;
  if(CONFIG.MOBILE    && !d.farm.mobile) d.farm.mobile=CONFIG.MOBILE;
  if(CONFIG.UPI       && !d.farm.upi)    d.farm.upi=CONFIG.UPI;
  if(CONFIG.LEAD_DAYS && !d.farm.leadDays) d.farm.leadDays=CONFIG.LEAD_DAYS;
  return d;
}
/* Runs once at startup (after helpers exist), never again after that. */
/* The starter produce and people are created identically on every phone -
   same ids, and version 1, the lowest version there is.

   They ARE sent to the Sheet, so the Sheet's tabs are complete and every
   order can name who sold it. But because they sit at version 1 they lose
   every contest: the moment the owner sets a real price or stock, that
   wins, and a phone opening the app for the very first time can never
   overwrite the real catalogue with its blank starter copy. */
const SEED_U=1;
function seedIfNew(){
  if(S.seeded) return;
  if((S.products||[]).length || (S.sellers||[]).length){ S.seeded=true; return; }
  SEED_PRODUCTS.forEach(x=>{
    const r=Object.assign({rate:x.prices[0].amt},JSON.parse(JSON.stringify(x)));
    r.u=SEED_U; S.products.push(r); });
  SEED_SELLERS.forEach((x,i)=>{ S.seq.person=i+1;
    S.sellers.push({id:x.id,code:x.code,name:x.name,mobile:'',u:SEED_U}); });
  S.seeded=true; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}
function save(){ stampChanges(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} pushSheet(); }

/* ═══════════════ 2. HELPERS ═══════════════ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* has this particular record reached the Sheet yet? */
const asFile=()=>{ try{ return !/^https?:$/.test(location.protocol); }catch(e){ return false; } };
const notSaved=r=>!!(S.sheetUrl && r && r.id && Number(r.u||0)!==Number((S.clean||{})[r.id]));
const R=n=>Math.round((Number(n)||0)*100)/100;
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
/* the local calendar date - NOT the UTC one. India is 5½ hours ahead, so
   a UTC date filed anything before 5:30am under yesterday, and the whole
   of the 1st before 5:30am under last month. */
function ymd(d){ d=d||new Date();
  const p=n=>(n<10?'0':'')+n;
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
const today=()=>ymd();
const dAgo=d=>Math.round((Date.now()-new Date(d+'T00:00').getTime())/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=(n,w)=>String(n).padStart(w,'0');
const $=id=>document.getElementById(id);
const val=id=>($(id)?$(id).value:'').trim();
const nval=id=>Number(val(id))||0;
/* stops one tap being counted twice on a slow phone */
let lastAct={k:'',t:0};
function once(key){ const now=Date.now();
  if(lastAct.k===key && now-lastAct.t<1800) return false;
  lastAct={k:key,t:now}; return true; }

/* ═══════════════ 4. MONEY MATHS ═══════════════ */
const oTotal=o=>R(o.items.reduce((s,i)=>s+i.qty*i.rate,0)+(+o.shipFee||0));
/* the cost as it was ON THE DAY, so closed months never move */
const oCost=o=>o.items.reduce((s,i)=>{
  if(i.cost!==undefined && i.cost!==null) return s+i.qty*(+i.cost||0);
  const p=S.products.find(x=>x.id===i.pid); return s+i.qty*(p?+p.cost||0:0); },0);
const billed=c=>S.orders.filter(o=>o.custId===c&&o.status!=='Cancelled').reduce((s,o)=>s+oTotal(o),0);
const paid=c=>S.payments.filter(p=>p.custId===c).reduce((s,p)=>s+p.amount,0);
const dues=c=>R(billed(c)-paid(c));
const totalDues=()=>R(S.customers.reduce((s,c)=>s+Math.max(0,dues(c.id)),0));
/* Payments are applied to the oldest bill first, the way a shop ledger
   works. The oldest bill still not covered is the one the customer is
   actually late on. */
function custOrders(c){ return S.orders.filter(o=>o.custId===c&&o.status!=='Cancelled')
  .sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:(a.code<b.code?-1:1))); }
function openBills(c){
  let pot=paid(c); const out=[];
  custOrders(c).forEach(o=>{ const t=oTotal(o);
    if(pot>=t){ pot=R(pot-t); return; }
    out.push({o:o,due:R(t-pot)}); pot=0; });
  return out;
}
const oldestUnpaid=c=>{ const b=openBills(c); return b.length?b[0].o:null; };
/* how much of THIS order is still owed, oldest-first */
function orderDue(o){ const b=openBills(o.custId).find(x=>x.o.id===o.id); return b?b.due:0; }
function lateDues(){return R(S.customers.reduce((s,c)=>{const d=dues(c.id);if(d<=0)return s;const o=oldestUnpaid(c.id);return s+((o&&dAgo(o.date)>7)?d:0);},0));}
const cashIn=()=>R(S.payments.reduce((s,p)=>s+p.amount,0)-S.expenses.reduce((s,e)=>s+e.amount,0));
const salesOn=d=>R(S.orders.filter(o=>o.date===d&&o.status!=='Cancelled').reduce((s,o)=>s+oTotal(o),0));
const mKey=d=>(d||today()).slice(0,7);
const inMonth=d=>mKey(d)===mKey();
const salesMonth=()=>R(S.orders.filter(o=>inMonth(o.date)&&o.status!=='Cancelled').reduce((s,o)=>s+oTotal(o),0));
const cogsMonth=()=>R(S.orders.filter(o=>inMonth(o.date)&&o.status!=='Cancelled').reduce((s,o)=>s+oCost(o),0));
const expMonth=()=>R(S.expenses.filter(e=>inMonth(e.date)).reduce((s,e)=>s+e.amount,0));
const profitMonth=()=>R(salesMonth()-cogsMonth()-expMonth());
function stockLeft(pid){const p=S.products.find(x=>x.id===pid);if(!p)return 0;
  const sold=S.orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.items.filter(i=>i.pid===pid).reduce((a,i)=>a+i.qty,0),0);
  return R((p.stock||0)-sold);}
const stockValue=()=>R(S.products.reduce((s,p)=>s+Math.max(0,stockLeft(p.id))*p.cost,0));
/* A produce's story in three numbers:
     in godown  = everything brought in, minus what has actually gone out
     promised   = taken in orders that are not delivered yet
     free       = what is genuinely still yours to sell                     */
function qtyIn(pid,status){
  return R(S.orders.filter(o=>status?o.status===status:o.status!=='Cancelled')
    .reduce((a,o)=>a+o.items.filter(i=>i.pid===pid).reduce((b,i)=>b+i.qty,0),0)); }
function stockBook(pid){
  const p=S.products.find(x=>x.id===pid)||{};
  const inn=R(p.stock||0), delivered=qtyIn(pid,'Delivered'), promised=qtyIn(pid,'Pending');
  return { p:p, inn:inn, delivered:delivered, promised:promised,
           godown:R(inn-delivered), free:R(inn-delivered-promised),
           low:(p.low==null?10:p.low) }; }

/* ═══════════════ 5. WHATSAPP PASTE PARSER ═══════════════ */
const UNITS={kg:'kg',kgs:'kg',kilo:'kg',kilos:'kg',k:'kg',g:'gram',gm:'gram',gms:'gram',gram:'gram',grams:'gram',
  dozen:'dozen',doz:'dozen',dz:'dozen',pc:'piece',pcs:'piece',piece:'piece',pieces:'piece',nos:'piece',no:'piece',
  box:'box',boxes:'box',crate:'crate',crates:'crate',bundle:'bundle',bundles:'bundle',packet:'packet',pkt:'packet'};
const NOISE=/\b(bhaiya|bhai|ji|sir|madam|please|pls|plz|kindly|need|want|send|bhejo|bhej|dena|do|de|chahiye|kar|karo|order|today|tomorrow|kal|aaj|morning|evening|urgent|fast|thanks|thank|you|ok|okay|hello|hi|namaste|good|and|aur|for|me|my|we|us|the|a|an|of)\b/gi;
function parseWA(text){
  const lines=String(text||'').split(/[\n,;•\-–]+/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  lines.forEach(raw=>{
    let s=raw.replace(/₹|rs\.?/gi,' ').replace(/\s+/g,' ').trim();
    if(!s) return;
    // Skip lines that are clearly not items: totals, addresses, phone numbers.
    if(/(total|amount|grand|balance|advance|paid|pincode|pin code|address|mobile|phone|contact)/i.test(s)) return;
    if(/\b[6-9]\d{9}\b/.test(s)) return;
    // Find the quantity ANYWHERE in the line, with an optional unit right after it.
    // Handles "5 kg mango", "mango 5 kg", and "Bhaiya 5 kg alphonso mango".
    const m=s.match(/(\d+(?:[.,]\d+)?)\s*([a-zA-Z]+)?/);
    if(!m) return;
    const qty=parseFloat(m[1].replace(',','.'));
    if(!(qty>0)) return;
    if(m[1].replace(/\D/g,'').length>=5) return;   // 411001 / 9876543210 are not quantities
    const w=(m[2]||'').toLowerCase();
    const unit=UNITS[w]||null;
    const cut=unit?m[0].length:m[1].length;      // eat the unit word only if it IS a unit
    let name=(s.slice(0,m.index)+' '+s.slice(m.index+cut)).trim();
    name=(name||'').replace(NOISE,' ').replace(/[^a-zA-Zऀ-ॿ ]/g,' ').replace(/\s+/g,' ').trim();
    if(!name) return;
    const p=matchProduct(name);
    // Only treat it as an item if there was a real unit, or it matches produce we know.
    // Stops stray text ("Pune 411001") from becoming an order line.
    if(!p && !unit) return;
    const pk=p?pickPrice(p,'R'):null;
    out.push({raw:raw.trim(),qty,unit:unit||(p?p.unit:'kg'),name:p?p.name:titl(name),pid:p?p.id:'',
      rate:pk?(Number(pk.amt)||0):0,plabel:pk?pk.label:'Typed',custom:!p,matched:!!p});
  });
  return out;
}
function titl(s){return s.replace(/\b\w/g,c=>c.toUpperCase());}
function matchProduct(name){
  const q=name.toLowerCase().trim(); if(!q) return null;
  let best=null,bestScore=0;
  S.products.forEach(p=>{
    const hay=(p.name+' '+(p.aliases||'')).toLowerCase();
    let sc=0;
    if(hay===q) sc=100;
    else if(hay.includes(q)||q.includes(p.name.toLowerCase())) sc=70+Math.min(20,q.length);
    else { const w=q.split(' ').filter(x=>x.length>2); w.forEach(x=>{if(hay.includes(x))sc+=25;}); }
    if(sc>bestScore){bestScore=sc;best=p;}
  });
  return bestScore>=25?best:null;
}

/* ═══════════════ 6. GOOGLE SHEET SYNC (optional) ═══════════════ */
/* ══════════════════════════════════════════════════════════════
   TWO-WAY SYNC

   Every phone sends everything it has to the Sheet, and the Sheet
   sends back one merged picture. The merging happens inside the
   Sheet, so three phones can never drift apart.

   Which change wins: each record carries the time it last changed,
   and the newest change to THAT record wins. Two people editing two
   different orders never clash. Deletions are remembered separately
   so a deleted item cannot come back to life.

   Sending uses a plain POST. Reading back uses a <script> tag
   (JSONP), because that works even when the file is opened straight
   off the phone with no web address.
   ══════════════════════════════════════════════════════════════ */
const SYNC_LISTS=['customers','sellers','products','orders','payments','expenses','stockLogs'];
let SIG={}, syncing=false, lastSync=0, syncTimer=null, pending=0, lastErr='', syncState='', wantAgain=false;

const sigOf=r=>JSON.stringify(r,(k,v)=>k==='u'?undefined:v);
const FARM_KEYS=['name','mobile','upi','leadDays','shipFee','pin'];
function initSig(){ SIG={};
  SYNC_LISTS.forEach(k=>(S[k]||[]).forEach(r=>{ if(r&&r.id) SIG[r.id]=sigOf(r); }));
  FARM_KEYS.forEach(k=>{ SIG['__f_'+k]=JSON.stringify(S.farm[k]===undefined?'':S.farm[k]); });
  SIG.__budgets=JSON.stringify(S.budgets||{}); }

/* stamps only what actually changed, so nothing steals a newer edit */
function stampChanges(){ const now=Date.now();
  SYNC_LISTS.forEach(k=>(S[k]||[]).forEach(r=>{ if(!r||!r.id) return;
    const j=sigOf(r); if(SIG[r.id]!==j){ SIG[r.id]=j; r.u=now; } }));
  /* one version per field, so two people changing two different settings
     never overwrite each other */
  FARM_KEYS.forEach(k=>{ const v=JSON.stringify(S.farm[k]===undefined?'':S.farm[k]);
    if(SIG['__f_'+k]!==v){ SIG['__f_'+k]=v; S.farmV[k]=now; S.farmU=now; } });
  const bj=JSON.stringify(S.budgets||{});
  if(SIG.__budgets!==bj){ SIG.__budgets=bj; S.farmV.budgets=now; S.farmU=now; }
  pending=countPending(); }
function killRec(id){ S.tomb=S.tomb||{}; S.tomb[id]=Date.now(); }

/* ── what the Sheet has NOT yet acknowledged ──
   S.clean holds, per record, the version the Sheet confirmed it has.
   A record is unsaved only when its own version differs from that.
   No clock comparison anywhere, so phones with wrong clocks are fine. */
const isDirty=r=>Number(r.u||0)!==Number(S.clean[r.id]);
const tombSig=()=>JSON.stringify(S.tomb||{});
const tombDirty=()=>tombSig()!==(S.cleanTomb||'{}');
function countPending(){ let c=tombDirty()?1:0;
  SYNC_LISTS.forEach(k=>(S[k]||[]).forEach(r=>{ if(r&&r.id&&isDirty(r)) c++; }));
  if(Number(S.farmU||0)!==Number(S.cleanFarmU)) c++;
  return c; }
function delta(){
  const d={tomb:S.tomb||{},seq:S.seq,farmU:0}, mark=[];
  SYNC_LISTS.forEach(k=>{ const out=(S[k]||[]).filter(r=>r&&r.id&&isDirty(r));
    if(out.length) d[k]=out;
    out.forEach(r=>mark.push([r.id,Number(r.u||0)])); });
  let sentFarm=false;
  if(Number(S.farmU||0)!==Number(S.cleanFarmU)){
    /* send only the settings this phone has actually touched */
    const fv=S.farmV||{}, only={};
    FARM_KEYS.forEach(k=>{ if(fv[k]!==undefined) only[k]=S.farm[k]; });
    d.farm=only; d.farmV=fv; d.farmU=Number(S.farmU)||0; sentFarm=true;
    if(fv.budgets!==undefined) d.budgets=S.budgets;
  }
  return {d:d,mark:mark,sentFarm:sentFarm,sentFarmU:Number(S.farmU)||0};
}
/* everything the Sheet just handed back is, by definition, saved */
function markClean(inc,mark,sent){
  const srv={};
  SYNC_LISTS.forEach(k=>(inc[k]||[]).forEach(r=>{ if(r&&r.id) srv[r.id]=Number(r.u||0); }));
  const pushed={}; mark.forEach(x=>pushed[x[0]]=Number(x[1]));
  const keep={};
  SYNC_LISTS.forEach(k=>(S[k]||[]).forEach(r=>{ if(!r||!r.id) return;
    const u=Number(r.u||0);
    if(srv[r.id]===u || pushed[r.id]===u) S.clean[r.id]=u;      /* confirmed */
    if(S.clean[r.id]!==undefined) keep[r.id]=S.clean[r.id]; }));
  S.clean=keep;                                                  /* forget gone records */
  /* the farm block is ticked off whenever we sent it and the Sheet took it,
     even when its version is still zero */
  if(sent && sent.sentFarm && Number(S.farmU||0)===Number(sent.sentFarmU)) S.cleanFarmU=Number(sent.sentFarmU);
  else if(Number(inc.farmU||0)>0 && Number(inc.farmU)===Number(S.farmU)) S.cleanFarmU=Number(S.farmU);
  if(inc.svMax!==undefined){
    const sv=Number(inc.svMax)||0;
    /* the Sheet's counter is the authority. If it has gone BACKWARDS the
       Sheet was reset or restored, so follow it down and re-read
       everything, rather than asking for records that can never exist. */
    S.since = (sv < Number(S.since||0)) ? sv : Math.max(Number(S.since)||0, sv);
  }
  if(inc.tabsAt!==undefined){ S.tabsAt=Number(inc.tabsAt)||0; S.tabsWaiting=!!inc.tabsWaiting; }
}

/* ── merge what the Sheet sends back into what is already here ── */
function mergeDown(inc){
  const tomb=inc.tomb||{};
  SYNC_LISTS.forEach(k=>{
    const mine=S[k]||[], map={}, order=[];
    const add=r=>{ if(!r||!r.id) return;
      if(tomb[r.id]&&Number(tomb[r.id])>=Number(r.u||0)) return;
      if(!map[r.id]){ map[r.id]=r; order.push(r.id); }
      else if(Number(r.u||0)>Number(map[r.id].u||0)) map[r.id]=r; };
    mine.forEach(add);
    (inc[k]||[]).forEach(add);
    S[k]=order.map(id=>map[id]).filter(Boolean);
  });
  if(inc.tomb){                      /* union, so a local deletion is never lost */
    const t=Object.assign({},inc.tomb);
    for(const id in (S.tomb||{})) if(!(t[id]>=S.tomb[id])) t[id]=S.tomb[id];
    S.tomb=t;
  }
  if(inc.farm||inc.budgets){
    const iv=inc.farmV||{}, fall=Number(inc.farmU||0);
    FARM_KEYS.forEach(k=>{
      if(!inc.farm || inc.farm[k]===undefined) return;
      if(iv[k]===undefined) return;        /* they never changed it - not theirs to overwrite */
      const theirs=Number(iv[k]), mine=Number((S.farmV||{})[k]||0);
      if(theirs>mine){ S.farm[k]=inc.farm[k]; S.farmV[k]=theirs; }
    });
    if(inc.budgets && iv.budgets!==undefined){
      const theirs=Number(iv.budgets), mine=Number((S.farmV||{}).budgets||0);
      if(theirs>mine){ S.budgets=inc.budgets; S.farmV.budgets=theirs; }
    }
    S.farmU=Math.max(Number(S.farmU||0), fall);
  }
  if(inc.seq) for(const k in inc.seq) S.seq[k]=Math.max(Number(S.seq[k])||0,Number(inc.seq[k])||0);
  if((S.products||[]).length||(S.sellers||[]).length) S.seeded=true;
  (S.products||[]).forEach(pr=>{
    if(!Array.isArray(pr.prices)||!pr.prices.length) pr.prices=[{label:'Retail',amt:Number(pr.rate)||0}];
    pr.rate=Number(pr.prices[0].amt)||0; if(pr.low==null) pr.low=10; });
  initSig();
}

/* did everything this phone sent actually arrive? */
function landed(inc,mark){
  if(!mark.length) return true;
  const have={};
  SYNC_LISTS.forEach(k=>(inc[k]||[]).forEach(r=>{ if(r&&r.id) have[r.id]=Number(r.u||0); }));
  const tomb=inc.tomb||{};
  for(let i=0;i<mark.length;i++){
    const id=mark[i][0], u=mark[i][1];
    if(tomb[id]) continue;                       /* deleted, so nothing to check */
    if(!(have[id]>=u)) return false;
  }
  return true;
}

function jsonp(url,ms){ return new Promise((res,rej)=>{
  const cb='fb'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
  const el=document.createElement('script');
  const done=setTimeout(()=>{clean();rej(new Error('timeout'));},ms||25000);
  function clean(){ clearTimeout(done); try{delete window[cb];}catch(e){window[cb]=undefined;} if(el.parentNode)el.parentNode.removeChild(el); }
  window[cb]=d=>{ clean(); res(d); };
  el.onerror=()=>{ clean(); rej(new Error('network')); };
  el.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb+'&t='+Date.now();
  document.head.appendChild(el);
}); }
const nap=ms=>new Promise(r=>setTimeout(r,ms));
/* a request that never answers must still end */
async function post(url,body,ms){
  const ac=(typeof AbortController!=='undefined')?new AbortController():null;
  const t=setTimeout(()=>{ if(ac) ac.abort(); }, ms||20000);
  try{
    return await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:body, signal:ac?ac.signal:undefined});
  } finally{ clearTimeout(t); }
}
async function postBlind(url,body,ms){
  const ac=(typeof AbortController!=='undefined')?new AbortController():null;
  const t=setTimeout(()=>{ if(ac) ac.abort(); }, ms||20000);
  try{
    return await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:body, signal:ac?ac.signal:undefined});
  } finally{ clearTimeout(t); }
}

/* ══════════════════════════════════════════════════════════════
   ONE SYNC = send my changes, then ask the Sheet what it now has.

   Nothing is marked "saved" until the Sheet hands those very
   records back. If they are not there, it tries again, and the
   changes stay queued on the phone in the meantime - so a busy
   Sheet or a dead signal can never quietly swallow an order.
   ══════════════════════════════════════════════════════════════ */
/* the readable tabs are rewritten at most once every few minutes so ten
   phones syncing at once stay cheap - this asks for it right now */
/* Tells you exactly which part of the chain is broken, in plain words. */
async function mDiag(){
  openSheet(head('Checking your Google Sheet','One moment')+`<div class="cs" id="dg">Testing…</div>`);
  const line=(ok,t)=>`<div class="row"><div class="av">${ok===null?'⏳':ok?'✅':'❌'}</div><div class="m"><b>${t}</b></div></div>`;
  let html='';
  if(!S.sheetUrl){
    html=line(false,'No Sheet link saved on this phone')+
      `<div class="note">Paste your /exec link in Admin → Google Sheet.</div>`;
    if($('dg')) $('dg').innerHTML=html; return;
  }
  html=line(true,'A Sheet link is saved');
  html+=line(!asFile(), asFile()
    ? 'Opened as a downloaded file — many phones block these from using the internet'
    : 'Opened from a proper web link');
  html+=line(!!S.everSynced, S.everSynced
    ? 'This phone has reached the Sheet before'
    : 'This phone has NEVER reached the Sheet');
  if($('dg')) $('dg').innerHTML=html+line(null,'Asking the Sheet to answer…');

  let ans=null, err='';
  try{ ans=await jsonp(S.sheetUrl+'?since=0',15000); }catch(e){ err=String(e.message||e); }

  if(!ans){
    html+=line(false,'The Sheet did not answer — most likely the OLD connector');
    html+=`<div class="note"><b>Two possible reasons.</b><br>
      1. The Sheet still has the <b>old connector code</b> — most likely. Open the Sheet →
         Extensions → Apps Script → paste the new <b>GoogleSheet_Connector.gs</b> over everything →
         Save → <b>Deploy → Manage deployments → pencil → Version: New version → Deploy</b>.<br>
      2. This phone has no internet right now.</div>`;
    S.oldConn=true;
  } else if(ans.v===undefined){
    html+=line(true,'The Sheet answered');
    html+=line(false,'But it is running the OLD connector');
    html+=`<div class="note">Open the Sheet → Extensions → Apps Script → paste the new
      <b>GoogleSheet_Connector.gs</b> over everything → Save →
      <b>Deploy → Manage deployments → pencil → Version: New version → Deploy</b>.
      Your /exec link does not change and no rows are lost.</div>`;
    S.oldConn=true;
  } else {
    html+=line(true,'The Sheet answered, and the connector is up to date (v'+ans.v+')');
    S.everSynced=true;
    S.oldConn=false;
    const n=countPending();
    html+=line(n===0,n===0?'Nothing is waiting to save':(n+' change'+(n>1?'s':'')+' still waiting'));
    if(n) html+=`<div class="note">Tap <b>Send now</b> on the Home screen. If it stays stuck,
      tell me and I will look further.</div>`;
    else  html+=`<div class="note">Everything is in order. Last refreshed ${agoTxt(lastSync||S.syncedAt)}.</div>`;
    html+=line(!ans.data.tabsWaiting, ans.data.tabsWaiting
      ? 'The readable tabs are behind — tap "Update the Sheet\'s tabs now" in Admin'
      : 'The readable tabs are up to date');
  }
  html+=`<button class="b o w" style="margin-top:13px" onclick="shut();render()">Close</button>`;
  if($('dg')) $('dg').innerHTML=html;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}

let syncStarted=0;
async function sync(loud,pull){
  if(!S.sheetUrl){ if(loud) toast('No Google Sheet linked yet'); return false; }
  /* if a previous run somehow never finished, let this one through */
  if(syncing && Date.now()-syncStarted>60000){ syncing=false; }
  if(syncing){ wantAgain=true; if(loud) toast('Already refreshing…'); return false; }
  syncStarted=Date.now();
  syncing=true; lastErr=''; setSync('working'); if(loud) render();
  const jit=()=>Math.floor(Math.random()*600);
  const waits=[0,700+jit(),1900+jit(),4200+jit(),8000+jit()];
  let ok=false, kind='';
  try{
    for(let a=0; a<waits.length && !ok; a++){
      /* a busy Sheet is worth waiting out; no signal is not - say so quickly
         and let the automatic retry pick it up later */
      if(kind==='old') break;                         /* retrying cannot help */
      if(a && kind==='net' && a>=2) break;
      if(a && navigator.onLine===false) break;
      if(waits[a]) await nap(waits[a]);
      stampChanges();
      const dd=delta(), d=dd.d, mark=dd.mark;
      const sendTomb=tombDirty(), tSig=tombSig();
      const since=Math.max(0,Number(S.since)||0);   /* the Sheet's counter, never a clock */

      /* ══ ONE ROUND TRIP ══
         The send used to be fire-and-forget, so the phone had to pause and
         then ask a second time - two Apps Script runs plus a wait. Now the
         send itself replies with the merged answer. If this phone's browser
         will not let us read that reply, it falls back to the old two-step
         way and remembers, so it only pays that price once. */
      let out=null;
      const haveNews=(mark.length || dd.sentFarm || sendTomb);
      const pkt=JSON.stringify({key:'farmbook',since:since,data:d});

      if(haveNews && S.oneTrip!==false){
        let res=null;
        try{ res=await post(S.sheetUrl,pkt,12000); }
        catch(e){
          /* the browser would not let us read the reply, or there is no signal.
             Only the first kind means we must use the slower two-step way. */
          if(S.oneTrip===true){ lastErr='no signal'; kind='net'; continue; }
          S.oneTrip=false; res=null;
        }
        if(res){
          S.oneTrip=true;                     /* reading replies works on this phone */
          S.oneTripTried=true;
          let txt='';
          try{ txt=await res.text(); }catch(e){ txt=''; }
          let body=null;
          try{ body=JSON.parse(txt); }catch(e){ body=null; }
          if(body && body.ok && body.data){ out=body; }
          else if(body && body.ok===false){ lastErr='the Sheet reported a problem'; kind='busy'; continue; }
          else if(/^\s*ok/i.test(txt)){
            /* An older connector is installed in the Sheet: it only replies
               "ok" and has no way to answer back. Say so plainly instead of
               retrying something that can never work. */
            S.oldConn=true; lastErr='old connector'; kind='old'; break;
          }
          else { lastErr='the Sheet was busy'; kind='busy'; continue; }
        }
      }
      if(out && out.v===undefined){ S.oldConn=true; lastErr='old connector'; kind='old'; break; }
      if(out) S.oldConn=false;
      if(!out){
        if(haveNews){
          try{ await postBlind(S.sheetUrl,pkt,12000); }
          catch(e){ lastErr='no signal'; kind='net'; continue; }
          await nap(mark.length>40?1200:650);
        } else if(!pull){ ok=true; break; }
        try{ out=await jsonp(S.sheetUrl+'?since='+since,15000); }
        catch(e){
          /* the send went out but nothing can answer: almost always an old
             connector still sitting in the Sheet */
          if(haveNews){ S.oldConn=true; lastErr='old connector'; kind='old'; break; }
          lastErr='no answer from the Sheet'; kind='net'; continue;
        }
        if(out && out.v===undefined){ S.oldConn=true; lastErr='old connector'; kind='old'; break; }
        if(out) S.oldConn=false;
      }
      if(!out||!out.ok||!out.data){ lastErr='the Sheet reported a problem'; continue; }
      if(!landed(out.data,mark)){ lastErr='the Sheet was busy'; kind='busy'; continue; }
      mergeDown(out.data);
      markClean(out.data,mark,dd);   /* only now is anything treated as saved */
      /* a working two-step sync means the signal is fine, so give the fast
         one-trip path another go next time rather than being stuck slow */
      if(S.oneTrip===false && !S.oneTripTried) S.oneTrip=null;
      if(sendTomb){
        let all=true;
        const back=out.data.tomb||{};
        for(const id in JSON.parse(tSig)) if(back[id]===undefined) all=false;
        if(all) S.cleanTomb=tSig;        /* only what was actually sent */
      }
      ok=true;
    }
    lastSync=Date.now(); S.syncedAt=ok?lastSync:S.syncedAt;
    if(ok) S.everSynced=true;
    pending=countPending();
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    setSync(ok?'ok':'fail');
    if(loud) toast(ok?'Up to date ✅'
      :kind==='old'?'Your Google Sheet still has the old connector — see Admin.'
      :kind==='net'?'No internet just now. Everything is safe on this phone and will save by itself.'
      :'The Sheet is busy — '+pending+' still to save. It will keep trying.');
  }catch(e){ setSync('fail'); lastErr=String(e.message||e); if(loud) toast('Could not reach the Sheet'); }
  syncing=false;
  render();
  if(wantAgain){ wantAgain=false; setTimeout(()=>sync(false,true),150); }
  else if(!ok) setTimeout(()=>{ if(!syncing && countPending()) sync(false,true); }, 45000);
  return ok;
}
const syncNow=loud=>sync(loud,true);

/* every save queues a confirmed send, batched so typing does not spam it */
function pushSheet(){
  if(!S.sheetUrl) return;
  pending=countPending(); setSync('dirty');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{
    sync(false, !mask.classList.contains('open'));   /* don't redraw under an open window */
  }, 4000);
}

function agoTxt(t){ if(!t) return 'not yet';
  const m=Math.floor((Date.now()-t)/60000);
  if(m<1) return 'just now'; if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }

function setSync(st){
  if(st===true||st===false||st===undefined) st=syncState;    /* never fake a good state */
  else syncState=st;
  const el=$('hSync'); if(!el) return;
  if(!S.sheetUrl){ el.className='sync'; el.textContent='On this phone'; return; }
  if(st==='working'){ el.className='sync on'; el.textContent='⏳ Saving…'; return; }
  if(st==='fail'){ el.className='sync bad'; el.textContent='⚠ '+pending+' not saved'; return; }
  if(pending){ el.className='sync on'; el.textContent='● '+pending+' to save'; return; }
  el.className='sync ok'; el.textContent='✓ Saved'; }

  return `<div class="rf" style="border-color:var(--green)">

        Last checked ${agoTxt(lastSync||S.syncedAt)}.</div>

function ageBuckets(){ const b=[{l:'Not due',v:0},{l:'1–7d',v:0},{l:'8–15d',v:0},{l:'16–30d',v:0},{l:'30d+',v:0}];
  S.customers.forEach(c=>{const d=dues(c.id);if(d<=0)return;const o=oldestUnpaid(c.id);const a=o?dAgo(o.date):0;
    b[a<=0?0:a<=7?1:a<=15?2:a<=30?3:4].v+=d;}); return b; }
function topProduce(){ const m={};
  S.orders.filter(o=>o.status!=='Cancelled').forEach(o=>o.items.forEach(i=>{
    const p=S.products.find(x=>x.id===i.pid);
    const key=(p&&p.name)||i.name;                 /* group by the produce, not the old name */
    m[key]=(m[key]||0)+i.qty*i.rate;}));
  return Object.keys(m).map(n=>({name:n,v:R(m[n])})).sort((a,b)=>b.v-a.v).slice(0,5); }
function bySeller(){ const m={}; S.orders.filter(o=>o.status!=='Cancelled'&&o.sellerId).forEach(o=>{m[o.sellerId]=(m[o.sellerId]||0)+oTotal(o);});
  return Object.keys(m).map(id=>{const s=S.sellers.find(x=>x.id===id);return{name:s?s.name:'—',v:R(m[id])};}).sort((a,b)=>b.v-a.v).slice(0,6); }
function alerts(){
  const outs=S.products.filter(p=>stockLeft(p.id)<0);
  const low=S.products.filter(p=>stockLeft(p.id)>=0&&stockLeft(p.id)<=(p.low==null?10:p.low));
  const late=S.customers.filter(c=>{const d=dues(c.id);const o=oldestUnpaid(c.id);return d>0&&o&&dAgo(o.date)>7;});
  if(!low.length&&!late.length&&!outs.length) return '';
  return `<div class="eb">Needs your attention</div>`+
    (outs.length?`<div class="warn" style="margin-bottom:10px">⚠️ <b>You have promised more than you have.</b>
      ${outs.map(p=>esc(p.name)+' is short by '+Math.abs(stockLeft(p.id))+' '+esc(p.unit)).join('; ')}.
      Add stock or correct the count in Admin.</div>`:'')+
    `<div class="card pad0">`+
    late.slice(0,4).map(c=>`<div class="row"><div class="av id">${esc(c.code)}</div><div class="m"><b>${esc(c.name)}</b><span>${money(dues(c.id))} · ${dAgo(oldestUnpaid(c.id).date)} days late</span></div>
      <div class="e"><button class="b wa s" onclick="remind('${c.id}')">Remind</button></div></div>`).join('')+
    outs.slice(0,4).map(p=>`<div class="row"><div class="av">${emo(p.name)}</div><div class="m"><b>${esc(p.name)}</b><span style="color:var(--red)">short by ${Math.abs(stockLeft(p.id))} ${esc(p.unit)}</span></div>
      <div class="e"><button class="b o s" onclick="mStock('${p.id}','in')">Add stock</button></div></div>`).join('')+
    low.slice(0,4).map(p=>`<div class="row"><div class="av">${emo(p.name)}</div><div class="m"><b>${esc(p.name)}</b><span>only ${stockLeft(p.id)} ${esc(p.unit)} left</span></div>
      <div class="e"><button class="b gh s" onclick="mStock('${p.id}','in')">Add stock</button></div></div>`).join('')+`</div>`;
}

/* --- backup / restore --- */
function backup(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='FarmBook-backup-'+today()+'.json'; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    toast('Backup saved to your downloads ✅');
  }catch(e){ toast('Could not save the backup here'); }
}
function restore(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d || !Array.isArray(d.products) || !Array.isArray(d.orders)) throw new Error('bad');
      if(!confirm('Replace everything on this phone with the backup?')) return;
      localStorage.setItem(KEY,JSON.stringify(d)); S=load(); adminOK=true; save();
      toast('Restored ✅'); go('home');
    }catch(e){ toast('That file is not a FarmBook backup'); } };
  r.readAsText(file);
}
function saveBudgets(){EXPCATS.forEach(c=>{const v=nval('bud_'+c.replace(/\W/g,''));if(v>0)S.budgets[c]=v;else delete S.budgets[c];});save();toast('Budgets saved ✅');}
function saveSheet(){S.sheetUrl=val('shUrl');save();toast(S.sheetUrl?'Syncing to your Sheet…':'Sheet link removed');render();}
function wipe(){
  const linked=!!S.sheetUrl;
  const msg=linked
    ? 'Clear everything from THIS PHONE?\n\nYour Google Sheet is not touched, so the farm\'s data will come back down the next time this phone connects. To start the farm over you would have to clear the Sheet as well.'
    : 'Delete everything and start fresh? This cannot be undone.';
  if(!confirm(msg)) return;
  const url=S.sheetUrl;
  localStorage.removeItem(KEY);
  S=JSON.parse(JSON.stringify(BLANK));
  S.sheetUrl=url;                     /* keep it linked, or the phone goes blind */
  adminOK=true; seedIfNew(); initSig();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  toast(linked?'This phone cleared — it will refill from the Sheet':'All cleared');
  go('home');
  if(url) setTimeout(()=>syncNow(false),600);
}

function saveProduct(){
  keepP();

  if(!prices.length) prices=[{label:'Retail',amt:R(P.prices[0]?P.prices[0].amt:0)}];
  const d={name:P.name,aliases:'',unit:P.unit,cost:R(P.cost),low:R(P.low),prices:prices,rate:prices[0].amt,fresh:false};
  if(P.id){ const t=S.products.find(x=>x.id===P.id);
    if(!t){ toast('This produce was removed on another phone'); P=null; shut(); render(); return; }
    Object.assign(t,d); toast('Saved ✅'); }
  else { S.products.push(Object.assign({id:uid(),stock:R(P.stock)},d)); toast('Produce added ✅'); }

function undoStock(lid){
  const g=S.stockLogs.find(x=>x.id===lid); if(!g) return;
  if(!confirm('Undo this stock entry? '+(g.qty>0?'+':'')+g.qty+' '+(g.unit||'')+' of '+g.name)) return;
  const p=S.products.find(x=>x.id===g.pid);
  if(p) p.stock=R((p.stock||0)-g.qty);
  killRec(lid); S.stockLogs=S.stockLogs.filter(x=>x.id!==lid);
  save(); toast('Undone — '+(p?g.name+' is now '+stockLeft(p.id)+' '+p.unit:'entry removed')); render();

/* --- stock in / out / correction, with a record of every change --- */
const STOCK_WHY={in:['Own harvest','Bought from another farm','Opening stock','Other'],
                 out:['Wastage / spoiled','Given free / sample','Own use','Other'],
                 set:['Counted the godown','Correcting a mistake','Other']};
function mStock(pid,mode){
  const p=S.products.find(x=>x.id===pid), left=stockLeft(pid);
  const t={in:'Add stock',out:'Take stock out',set:'Correct the stock'}[mode];
  openSheet(head(t, esc(p.name)+' · '+left+' '+esc(p.unit)+' left now')+`
    <label>${mode==='set'?'How much is actually left':'How many '+esc(p.unit)}</label>
    <input id="stQ" type="number" inputmode="decimal" value="${mode==='set'?left:''}" placeholder="0">
    <label>Why</label><select id="stW">${STOCK_WHY[mode].map(w=>`<option>${w}</option>`).join('')}</select>
    <label>Note (optional)</label><input id="stN" placeholder="e.g. picked from the north block">
    ${byPicker('stBy','Recorded by')}
    <button class="b o w" style="margin-top:14px" onclick="saveStock('${pid}','${mode}')">Save</button>`);
}
function saveStock(pid,mode){
  const p=S.products.find(x=>x.id===pid), q=nval('stQ');
  if(!val('stBy')){toast('Pick who is recording this');return;}
  if(!once('stock|'+pid+'|'+mode+'|'+q)){ shut(); return; }
  let delta;
  if(mode==='set'){ delta=R(q-stockLeft(pid)); if(delta===0){ shut(); toast('Nothing to change'); return; } }
  else if(mode==='out'){ if(!(q>0)){toast('Enter how many');return;} delta=-R(q); }
  else { if(!(q>0)){toast('Enter how many');return;} delta=R(q); }
  p.stock=R((p.stock||0)+delta);
  S.stockLogs.push({id:uid(),date:today(),pid:pid,name:p.name,unit:p.unit,qty:delta,
    kind:{in:'Added',out:'Taken out',set:'Corrected'}[mode],why:val('stW'),note:val('stN'),byId:val('stBy')});
  save(); shut(); toast('Stock is now '+stockLeft(pid)+' '+p.unit+' ✅'); render();
}

function mOrder(id){
  if(!S.products.length){mProduct(true);toast('Add one produce first');return;}
  D={editId:'',custId:'',custNew:'',mobile:'',type:'R',sellerId:S.sellers[0]?S.sellers[0].id:'',items:[],paid:false,note:'',
     orderDate:today(), pincode:'', city:'', address:'', ship:'free', shipFee:0, addNewSeller:false};
  orderRun++;
  const o=id?S.orders.find(x=>x.id===id):null;
  if(o){ D.editId=o.id; D.custId=o.custId; D.sellerId=o.sellerId; D.orderDate=o.date;

    D.items=o.items.map(i=>({pid:i.pid,name:i.name,qty:i.qty,unit:i.unit,rate:i.rate,plabel:i.plabel||'',custom:!!i.custom})); }
  drawOrder();
}
/* the number belongs to somebody we already know - switch to them, so the
   right price band applies before anything is added up */
function knownMobile(v){
  if(!D||D.custId) return;
  const box=$('oKnown');
  const d=digits(v);
  const c=(d.length===10)?S.customers.find(x=>x.mobile===d):null;
  D.knownCust=c?c.id:'';
  if(!c){ if(box){box.innerHTML='';box.style.display='none';} return; }
  D.type=c.code[0]||'R';
  repriceAll(); liveT();                       /* right prices, no redraw */
  if(box){ box.style.display='block';
    box.innerHTML='✓ This number is <b>'+esc(c.name)+'</b> ('+esc(c.code)+'). '
      +'The order will go to them, at '+esc(TYPES[c.code[0]]||'their')+' prices.'; }
}
function custType(){ if(!D) return 'R';
  if(D.custId){ const c=S.customers.find(x=>x.id===D.custId); return (c&&c.code)?c.code[0]:'R'; }
  return D.type||'R'; }
function repriceAll(){ const t=custType();
  D.items.forEach(i=>{ if(i.custom) return; const p=S.products.find(x=>x.id===i.pid); if(!p) return;
    const pk=pickPrice(p,t); i.rate=Number(pk.amt)||0; i.plabel=pk.label; }); }
function setItemProduce(x,v){
  const i=D.items[x]; if(!i) return;
  keep();
  if(v==='__new'){ P=null; const nm=i.name; D.items.splice(x,1); drawOrder();
    setTimeout(()=>{ mProduct(); if($('pName')) $('pName').value=nm; },60); return; }
  const p=S.products.find(y=>y.id===v); if(!p) return;
  const pk=pickPrice(p,custType());
  Object.assign(i,{pid:p.id,name:p.name,unit:p.unit,rate:Number(pk.amt)||0,plabel:pk.label,custom:false});
  drawOrder();
}
function pickRate(x,v){ const i=D.items[x], p=S.products.find(y=>y.id===i.pid);
  if(v==='__c'){ i.custom=true; i.plabel='Typed'; }
  else { const pk=plist(p)[Number(v)]; if(pk){ i.custom=false; i.rate=Number(pk.amt)||0; i.plabel=pk.label; } }
  keep(); drawOrder(); }
function keep(){ // remember what is typed before a redraw
  if(!D) return;
  if($('oNewName'))D.custNew=val('oNewName'); if($('oNewMob'))D.mobile=val('oNewMob'); if($('oNewType'))D.type=val('oNewType');

/* when editing an order, its own quantity is already taken out of stock,
   so add it back before judging whether the new quantity fits */
function originalQty(oid,pid){ const o=S.orders.find(x=>x.id===oid); if(!o) return 0;
  return o.items.filter(i=>i.pid===pid).reduce((a,i)=>a+i.qty,0); }
function shortList(){ if(!D) return [];
  return D.items.map(i=>{ const p=S.products.find(x=>x.id===i.pid); if(!p) return null;
      const free=R(stockLeft(p.id)+(D.editId?originalQty(D.editId,i.pid):0));
      const short=R(i.qty-free);
      return short>0?{name:p.name,unit:i.unit,short:short}:null; }).filter(Boolean); }
function stkLine(i,free){
  const over=R(i.qty-free);
  return over>0
    ? `<div class="stk bad">⚠️ Only ${free} ${esc(i.unit)} left — this order is ${over} ${esc(i.unit)} short. Add stock in Admin, or lower the quantity.</div>`
    : `<div class="stk">${free} ${esc(i.unit)} in stock${free-i.qty<=0?' — this finishes it':''}</div>`;
}
function paintDeliv(){ const el=$('oDeliv'); if(!el||!D) return;
  el.innerHTML=`🚚 <b>Expected delivery:</b> ${niceDate(estDeliv())}

/* updates the figures in place - never redraws, so a tap is never swallowed */
function liveT(){
  if(!D) return;
  if($('oShipFee')) D.shipFee=nval('oShipFee');
  D.items.forEach((i,x)=>{
    const p=S.products.find(y=>y.id===i.pid);
    const free=p?R(stockLeft(p.id)+(D.editId?originalQty(D.editId,i.pid):0)):0;
    const a=document.querySelector('[data-amt="'+x+'"]'); if(a) a.textContent=money(i.qty*i.rate);
    const c=document.querySelector('[data-cst="'+x+'"]');
    if(c) c.innerHTML=`${i.qty} ${esc(i.unit)} × ${money(i.rate)} = <b>${money(i.qty*i.rate)}</b> · a one-off price, the price list is not changed`;
    const st=document.querySelector('[data-stk="'+x+'"]'); if(st) st.innerHTML=stkLine(i,free);
    const blk=st&&st.closest('.ib'); if(blk) blk.classList.toggle('over',R(i.qty-free)>0);
  });
  const sh=shortList(), box=$('oShort');
  if(box) box.innerHTML = sh.length
    ? `<div class="warn">⚠️ <b>Not enough stock</b> for ${sh.map(x=>esc(x.name)+' (short '+x.short+' '+esc(x.unit)+')').join(', ')}.
        You can still save this order — just fix the stock in Admin so the numbers stay honest.</div>` : '';
  if($('oTot')) $('oTot').textContent=money(grand());
}

  else { const pk=pickPrice(pr,custType());

function sellerPick(v){ keep(); if(v==='__new'){D.addNewSeller=true;} else {D.sellerId=v;D.addNewSeller=false;} drawOrder(); }

/* pull name / mobile / pincode / total out of pasted or scanned text */
function extractMeta(t){
  const mob=((t.match(/(?:\+?91[\s-]?)?\b([6-9]\d{9})\b/)||[])[1])||'';
  let pin=((t.match(/pin(?:code)?\s*[:\-]?\s*(\d{6})/i)||[])[1])||'';
  if(!pin){ const c=t.match(/\b(\d{6})\b/g)||[]; pin=(c.find(x=>!mob.includes(x)))||''; }
  let name=((t.match(/name\s*[:\-]\s*(.+)/i)||[])[1]||'').trim();
  if(!name){
    const bad=/\b(kg|gram|dozen|piece|box|crate|bundle|packet|total|amount|order|address|pincode|pin|delivery|rs|inr)\b/i;
    for(const l of t.split(/\n/).map(x=>x.trim()).filter(Boolean)){
      const w=l.replace(/[^A-Za-z ]/g,' ').trim();
      if(w && !/\d/.test(l) && !bad.test(l) && w.split(/\s+/).length<=4 && w.length>2){ name=w; break; }
    }
  }
  const tot=((t.match(/(?:total|amount|value|grand)\s*[:\-]?\s*(?:rs\.?|₹|inr)?\s*(\d[\d,]*)/i)||[])[1])||'';
  return {mobile:mob,pincode:pin,name:name.slice(0,40),total:tot?Number(tot.replace(/,/g,'')):0};
}
function applyText(txt){
  const found=parseWA(txt), meta=extractMeta(txt);
  let unknown=0;
  found.forEach(f=>{
    if(!f.pid){                       /* not one of your produce - ask, don't invent */
      D.items.push({pid:'',name:f.name,qty:f.qty,unit:f.unit,rate:0,plabel:'Typed',custom:true});
      unknown++; return;
    }
    const has=D.items.find(i=>i.pid===f.pid);
    if(has) has.qty=R(has.qty+f.qty);
    else D.items.push({pid:f.pid,name:f.name,qty:f.qty,unit:f.unit,rate:f.rate||0,plabel:f.plabel||'Retail',custom:!!f.custom});
  });
  if(unknown) setTimeout(()=>toast(unknown+' line'+(unknown>1?'s':'')+' not recognised — pick the produce below'),1200);
  repriceAll();
  if(meta.mobile){
    const ex=S.customers.find(c=>c.mobile===meta.mobile);
    if(ex){ D.custId=ex.id; } else { D.mobile=meta.mobile; if(meta.name) D.custNew=meta.name; }
  } else if(meta.name && !D.custId && !D.custNew) D.custNew=meta.name;
  if(meta.pincode) D.pincode=meta.pincode;
  D.note=txt.slice(0,600);
  save(); drawOrder();
  const bits=[];
  if(found.length) bits.push(found.length+' item'+(found.length>1?'s':''));
  if(meta.mobile) bits.push('mobile');
  if(meta.name) bits.push('name');
  if(meta.pincode) bits.push('pincode');
  toast(bits.length?('Filled in: '+bits.join(', ')):'Nothing recognised — please type it in');
  if(meta.total && Math.abs(meta.total-itemsSum())>1)
    setTimeout(()=>toast('Message says total '+money(meta.total)+' — check the prices'),2400);
}
function readText(){ keep(); const t=val('waText'); if(!t){toast('Paste the message first');return;} applyText(t); }

/* screenshot → text, in the browser */
function loadScript(src){ return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('load'));document.head.appendChild(el);}); }
async function readShot(file){
  if(!file) return;
  keep();
  const mine=orderRun;                       /* if the form is gone, stay gone */
  const msg=$('shotMsg'); const set=t=>{ if($('shotMsg'))$('shotMsg').textContent=t; };
  set('Reading the screenshot… this can take a few seconds.');
  try{
    if(typeof window.Tesseract==='undefined')
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js');
    const out=await window.Tesseract.recognize(file,'eng',{logger:m=>{
      if(m.status==='recognizing text') set('Reading the screenshot… '+Math.round((m.progress||0)*100)+'%');
    }});
    const txt=(out&&out.data&&out.data.text)||'';
    if(!txt.trim()){ set('Could not read any text. Please type it in below.'); toast('No text found in that image'); return; }
    if(mine!==orderRun || !mask.classList.contains('open')){ toast('Screenshot read, but the order was closed'); return; }
    const box=$('waText'); if(box) box.value=txt;
    set('Read it. Check the details below.');
    applyText(txt);
  }catch(e){
    set('Screenshot reading is not available here — please paste the message text instead.');
    toast('Could not read the screenshot');
  }
}

function saveOrder(){
  keep();
  D.sellerId=($('oSeller')&&val('oSeller')!=='__new')?val('oSeller'):D.sellerId;

  /* --- nothing is saved until the customer is properly identified --- */
  const e={};
  if(!D.custId){
    e.oNewName = D.custNew ? '' : 'Customer name is needed';
    e.oNewMob  = badMobile(D.mobile);
  }
  e.oCity = D.city ? '' : 'City or town is needed';
  e.oPin  = badPin(D.pincode);
  const clean=showErrs(e);
  if(!D.items.length){ toast('Add at least one item'); return; }
  if(D.items.some(i=>!i.pid)){ toast('One line has no produce chosen — pick it or remove it'); return; }
  if(!clean){ toast('Please fill the boxes marked in red'); return; }

  let cid=D.custId;
  if(!cid){
    const mob=digits(D.mobile);
    const ex=S.customers.find(c=>c.mobile===mob);
    if(ex){ cid=ex.id;
      /* the number belongs to somebody we know - charge their band, not the
         default retail one the form started on */
      const before=D.items.map(i=>i.rate).join(',');
      D.type=ex.code[0]||'R'; repriceAll();
      if(D.items.map(i=>i.rate).join(',')!==before)
        toast('Using '+ex.name+'\'s '+(TYPES[ex.code[0]]||'')+' prices');
    }
    else { const c={id:uid(),code:newCustCode(D.type||'R'),name:D.custNew,mobile:mob,
        address:[D.address,D.city,D.pincode].filter(Boolean).join(', '),terms:0,sellerId:D.sellerId,byId:D.sellerId};
      S.customers.push(c); cid=c.id; }
  }
  const ship=D.ship==='paid'?R(D.shipFee||0):0;
  const body={date:D.orderDate||today(),deliveryDate:estDeliv(),custId:cid,sellerId:D.sellerId,
    items:D.items.map(i=>{ const pr=S.products.find(x=>x.id===i.pid);
      return {pid:i.pid,name:i.name,qty:R(i.qty),unit:i.unit,rate:R(i.rate),
        plabel:i.plabel||'',custom:!!i.custom,
        cost:(i.cost!==undefined&&i.cost!==null)?+i.cost:(pr?+pr.cost||0:0)}; }),
    pincode:D.pincode,city:D.city,address:D.address,
    shipMode:D.ship==='paid'?'Shipped':'Free home delivery', shipFee:ship, note:D.note||''};
  if(D.editId){
    const ex=S.orders.find(x=>x.id===D.editId);
    if(!ex){ toast('That order was removed on another phone'); shut(); render(); return; }
    Object.assign(ex,body);
    const had=ex.payId && S.payments.find(x=>x.id===ex.payId);
    if(D.paid){
      if(had){ had.amount=oTotal(ex); had.date=ex.date; }        /* keep it in step */
      else { const pay={id:uid(),date:ex.date,custId:cid,amount:oTotal(ex),mode:'Cash',byId:ex.sellerId};
        S.payments.push(pay); ex.payId=pay.id; ex.status='Delivered'; }
    } else if(had){
      killRec(had.id); S.payments=S.payments.filter(x=>x.id!==had.id); ex.payId='';
    }
    save(); shut(); toast('Order updated ✅'); render(); return;
  }
  const o=Object.assign({id:uid(),code:newOrderCode(),status:D.paid?'Delivered':'Pending'},body);
  S.orders.push(o);
  if(D.paid){ const pay={id:uid(),date:o.date,custId:cid,amount:oTotal(o),mode:'Cash',byId:o.sellerId};
    S.payments.push(pay); o.payId=pay.id; }
  save();shut();toast('Order saved ✅');go('orders');
}

function mPayment(cid){
  openSheet(head('Money received','From a customer')+`
    <label>Customer</label><select id="pCust">${S.customers.map(c=>`<option value="${c.id}" ${cid===c.id?'selected':''}>${esc(c.code)} · ${esc(c.name)} — ${money(dues(c.id))} due</option>`).join('')}</select>
    <label>Amount ₹</label><input id="pAmt" type="number" inputmode="decimal" value="${cid?Math.max(0,dues(cid)):''}">
    <label>How</label><select id="pMode">${['Cash','UPI','Bank transfer','Cheque'].map(m=>`<option>${m}</option>`).join('')}</select>
    ${byPicker('pBy','Received by')}
    <button class="b g w" style="margin-top:14px" onclick="savePayment()">Save payment</button>`);
}
function savePayment(){const c=val('pCust'),a=nval('pAmt');if(!c){toast('Pick a customer');return;}if(a<=0){toast('Enter the amount');return;}
  if(!val('pBy')){toast('Pick who received the money');return;}
  if(!once('pay|'+c+'|'+a)){ shut(); return; }
  S.payments.push({id:uid(),date:today(),custId:c,amount:R(a),mode:val('pMode'),byId:val('pBy')});save();shut();toast('Payment saved ✅');render();}
function mExpense(){

    <label>Amount ₹</label><input id="eAmt" type="number" inputmode="decimal">
    <label>What for</label><select id="eCat">${EXPCATS.map(c=>`<option>${c}</option>`).join('')}</select>
    <label>Paid by</label><select id="eMode">${['Cash','UPI','Bank transfer'].map(m=>`<option>${m}</option>`).join('')}</select>
    <label>Note (optional)</label><input id="eNote">
    ${byPicker('eBy','Spent by')}
    <button class="b o w" style="margin-top:14px" onclick="saveExpense()">Save expense</button>`);
}
