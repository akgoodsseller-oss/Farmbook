  if(!val('eBy')){toast('Pick who spent it');return;}
  if(!once('exp|'+val('eCat')+'|'+a)){ shut(); return; }
  S.expenses.push({id:uid(),date:today(),amount:R(a),cat:val('eCat'),mode:val('eMode'),note:val('eNote'),byId:val('eBy')});save();shut();toast('Expense saved ✅');render();}

/* --- ledger + reminder --- */
function mLedger(cid){
  const c=S.customers.find(x=>x.id===cid);
  const rows=[]; S.orders.filter(o=>o.custId===cid&&o.status!=='Cancelled').forEach(o=>rows.push({d:o.date,t:o.code+' (order)',dr:oTotal(o),cr:0}));
  S.payments.filter(p=>p.custId===cid).forEach(p=>rows.push({d:p.date,t:'Payment · '+p.mode,dr:0,cr:p.amount,pid:p.id}));
  rows.sort((a,b)=>a.d<b.d?-1:1); let run=0;
  openSheet(head(esc(c.name), `${esc(c.code)} · ${TYPES[c.code[0]]||''} · ${esc(c.mobile||'')}`)+`
    <div class="sx"><table class="tb"><tr><th>Date</th><th>What</th><th class="r">Billed</th><th class="r">Paid</th><th class="r">Balance</th></tr>
      ${rows.length?rows.map(r=>{run+=r.dr-r.cr;return `<tr><td>${r.d.slice(5)}</td><td>${esc(r.t)}${r.pid?` <button class="b gh" style="padding:1px 6px;font-size:10px" onclick="receiptPDF('${r.pid}',true)">receipt</button>`:''}</td><td class="r n">${r.dr?money(r.dr):''}</td><td class="r n">${r.cr?money(r.cr):''}</td><td class="r n">${money(run)}</td></tr>`;}).join('')
        :'<tr><td colspan="5" style="color:var(--muted)">No transactions yet.</td></tr>'}
      <tr><td colspan="4"><b>Still to pay</b></td><td class="r n"><b>${money(dues(cid))}</b></td></tr></table></div>
    <div class="br" style="margin-top:13px"><button class="b wa" onclick="remind('${cid}')">Remind on WhatsApp</button>
      <button class="b g" onclick="mPayment('${cid}')">Got money</button></div>`);
}
function remind(cid){
  const c=S.customers.find(x=>x.id===cid), d=dues(cid), farm=S.farm.name||'our farm';
  let m=`Namaste ${c.name},\n\n${money(d)} is pending against your account (${c.code}).`;
  if(S.farm.upi) m+=`\n\nYou can pay by UPI: ${S.farm.upi}`;
  m+=`\n\nThank you,\n${farm}`;
  const ph=(c.mobile||'').replace(/\D/g,'');
  window.open('https://wa.me/'+(ph?(ph.length===10?'91':'')+ph:'')+'?text='+encodeURIComponent(m),'_blank');
}

/* --- connector help --- */
function mConnector(){
  const code=`/*  FarmBook <-> Google Sheet  (two-way)

    doPost : a phone sends everything it has. The Sheet merges it into
             the master copy and rewrites the readable tabs.
    doGet  : a phone asks for the merged master copy back.

    The master copy is JSON in a hidden tab called _data. The other
    tabs are for you to READ. Typing into them does not come back into
    the app - change things in the app's Admin screen instead.

    Which change wins: every record carries the time it last changed,
    and for that record the later change wins. Deletions are kept in a
    list of their own so a deleted item cannot come back to life.       */

var LISTS = ['customers','sellers','products','orders','payments','expenses','stockLogs'];
var BLOB  = '_data';
var TAB_GAP = 180000;      /* rewrite the readable tabs at most once every 3 minutes */
var SV = 0;                /* the Sheet's own counter - see sliceSince_ */
var VER = 3;               /* the app checks this, so it can tell you when
                              an older copy of this file is still installed */

function doPost(e){
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try{
    var body0 = JSON.parse(e.postData.contents);
    var inc = body0.data || {};
    var ss  = SpreadsheetApp.getActive();
    var out = merge_(readBlob_(ss), inc);

    /* The phones read the master copy, not the tabs, so the tabs do not
       have to be rewritten on every single sync. Rewriting them is by far
       the slowest part - throttling it is what lets ten phones share one
       Sheet without running out of Google's daily script time. */
    var now = Date.now();
    if(now - Number(out._tw||0) > TAB_GAP){ out._tw = now; out._dirty = false; writeTabs_(ss,out); }
    else out._dirty = true;

    writeBlob_(ss, out);

    /* Reply with the merged answer, so one round trip does the whole job.
       Older phones that cannot read this reply just ignore it and ask
       again with doGet - both ways work. */
    return ContentService
      .createTextOutput(JSON.stringify({ ok:true, v:VER, since:Number(body0.since)||0,
                                         data: sliceSince_(out, Number(body0.since)||0) }))
      .setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput('error: '+err);
  }finally{
    lock.releaseLock();
  }
}

function doGet(e){
  var out;
  try{
    var ss    = SpreadsheetApp.getActive();
    var since = Number(e && e.parameter && e.parameter.since) || 0;
    var d     = readBlob_(ss);

    /* Bring the readable tabs up to date - either because the app asked
       outright, or because a change is waiting and the quiet period has
       passed. Without this second case the LAST change of the day could
       sit in the master copy and never reach the tabs, because only a new
       send used to trigger the rewrite. */
    var wantNow  = !!(e && e.parameter && e.parameter.tabs);
    var overdue  = d._dirty && (Date.now() - Number(d._tw||0) > TAB_GAP);
    if(wantNow || overdue){
      var lk = LockService.getScriptLock();
      if(lk.tryLock(wantNow ? 25000 : 5000)){
        try{
          d = readBlob_(ss);                 /* pick up anything that landed meanwhile */
          d._tw = Date.now(); d._dirty = false;
          writeTabs_(ss,d); writeBlob_(ss,d);
        } finally{ lk.releaseLock(); }
      }
    }

    out = JSON.stringify({ ok:true, v:VER, since:since, data: sliceSince_(d, since) });
  }catch(err){
    out = JSON.stringify({ ok:false, error:String(err) });
  }
  var cb = e && e.parameter && e.parameter.callback;
  if(cb) return ContentService.createTextOutput(cb+'('+out+');')
          .setMimeType(ContentService.MimeType.JAVASCRIPT);
  return ContentService.createTextOutput(out).setMimeType(ContentService.MimeType.JSON);
}

/* ---------- the master copy, split over rows because one cell
              only holds 50,000 characters ---------- */
function readBlob_(ss){
  var sh = ss.getSheetByName(BLOB);
  if(!sh) return {};
  var last = sh.getLastRow();
  if(!last) return {};
  var v = sh.getRange(1,1,last,1).getValues(), t = '';
  for(var i=0;i<v.length;i++) t += norm_(v[i][0]);
  if(!t) return {};
  try{ return JSON.parse(t); }
  catch(err){
    /* Something damaged the master copy. Do NOT pretend the Sheet is empty
       - that would let the next phone overwrite everybody's data with its
       own. Stop, and keep the damaged copy for recovery. */
    throw new Error('The _data tab is damaged and could not be read. '
      + 'Nothing was changed. Restore the Sheet from File > Version history.');
  }
}
function writeBlob_(ss,d){
  var sh = ss.getSheetByName(BLOB) || ss.insertSheet(BLOB);
  var t = JSON.stringify(d), N = 45000, rows = [], at = 0;
  while(at < t.length){
    var take = Math.min(N, t.length-at);
    /* never let the NEXT chunk start with a character Sheets would read
       as a formula, or the master copy comes back corrupted */
    while(take > 1 && at+take < t.length && '=+-@'.indexOf(t.charAt(at+take)) >= 0) take--;
    rows.push([t.substr(at,take)]);
    at += take;
  }
  if(!rows.length) rows = [['']];
  sh.clear();
  sh.getRange(1,1,rows.length,1).setValues(rows);
  try{ sh.hideSheet(); }catch(err){}
}

/* Only what changed since this phone last heard from us.

   This counts with the SHEET'S own counter (sv), not with the phones'
   clocks. Phone clocks disagree, and orders do not arrive in clock order:
   a phone that had already heard "everything up to 10:05" would never be
   sent an order another phone stamped 10:04 but delivered later. The
   Sheet's counter only ever goes up, and it is the same counter for
   everybody, so nothing can slip behind it. */
function sliceSince_(d,since){
  var body = { tomb:d.tomb||{}, seq:d.seq||{}, farmU:0, svMax:Number(d.sv||0),
               tabsAt:Number(d._tw||0), tabsWaiting:!!d._dirty };
  for(var i=0;i<LISTS.length;i++){
    var key = LISTS[i], src = d[key] || [], keep = [];
    for(var r=0;r<src.length;r++) if(Number(src[r].sv||0) > since) keep.push(src[r]);
    if(keep.length) body[key] = keep;
  }
  if(Number(d.farmSv||0) > since){ body.farm=d.farm||{}; body.budgets=d.budgets||{};
    body.farmV=d.farmV||{}; body.farmU=Number(d.farmU||0); }
  return body;
}

/* ---------- the merge ---------- */
function merge_(a,b){
  var out = {}, k;
  SV = Number(a.sv||0);
  var tomb = {};
  var t1 = a.tomb || {}, t2 = b.tomb || {};
  for(k in t1) tomb[k] = Number(t1[k])||0;
  for(k in t2) if(!tomb[k] || Number(t2[k])>tomb[k]) tomb[k] = Number(t2[k])||0;

  for(var i=0;i<LISTS.length;i++){
    var key = LISTS[i];
    out[key] = mergeList_(a[key]||[], b[key]||[], tomb);
  }
  out.tomb = tomb;

  /* Settings merge FIELD BY FIELD. Taking the whole block from whoever
     saved last meant one person typing a farm name could wipe the Admin
     code everybody else relied on. */
  var FARM_KEYS = ['name','mobile','upi','leadDays','shipFee','pin'];
  var au = Number(a.farmU||0), bu = Number(b.farmU||0);
  var av = a.farmV||{}, bv = b.farmV||{};
  out.farm = {}; out.farmV = {};
  for(var fk=0; fk<FARM_KEYS.length; fk++){
    var key = FARM_KEYS[fk];
    var aHas = a.farm && a.farm[key]!==undefined && av[key]!==undefined;
    var bHas = b.farm && b.farm[key]!==undefined && bv[key]!==undefined;
    var at = aHas ? Number(av[key]) : -1;
    var bt = bHas ? Number(bv[key]) : -1;
    if(bHas && (!aHas || bt >= at)){ out.farm[key] = b.farm[key]; out.farmV[key] = bt; }
    else if(aHas){ out.farm[key] = a.farm[key]; out.farmV[key] = at; }
    else if(a.farm && a.farm[key]!==undefined){ out.farm[key] = a.farm[key]; }
  }
  var abt = (av.budgets!==undefined) ? Number(av.budgets) : -1;
  var bbt = (bv.budgets!==undefined) ? Number(bv.budgets) : -1;
  if(b.budgets && bbt >= 0 && bbt >= abt){ out.budgets = b.budgets; out.farmV.budgets = bbt; }
  else { out.budgets = a.budgets || {}; if(abt >= 0) out.farmV.budgets = abt; }
  out.farmU   = Math.max(au,bu);
  out.seq     = maxSeq_(a.seq, b.seq);
  out.seeded  = true;
  out._tw     = Number(a._tw||0);
  out._dirty  = !!a._dirty;
  out.farmSv  = Number(a.farmSv||0);
  if(out.farmU !== Number(a.farmU||0)) out.farmSv = ++SV;
  renumber_(out);
  out.sv = SV;
  return out;
}

/* Two phones offline at the same time can both mint ORD-0001 or R-0001.
   The Sheet is the only place that sees everybody, so it is the only
   place that can settle it: whoever created theirs first keeps the
   number, the other gets the next free one, and the corrected number
   travels back to every phone. */
function pad_(n,w){ n=String(n); while(n.length<w) n='0'+n; return n; }
/* the same "first one keeps it, the rest are re-issued" rule, for a
   numbered field that is not the record's own code */
function fixNum_(rows,field,prefix,seqKey,width,seq){
  if(!rows || !rows.length) return;
  rows.sort(function(m,n){ return (Number(m.u||0))-(Number(n.u||0)); });
  var used = {}, i, r, num, now = Date.now();
  for(i=0;i<rows.length;i++){
    r = rows[i];
    if(r[field] && !used[r[field]]){
      used[r[field]] = true;
      num = Number(String(r[field]).split('-').pop()) || 0;
      if(num > (Number(seq[seqKey])||0)) seq[seqKey] = num;
    }
  }
  for(i=0;i<rows.length;i++){
    r = rows[i];
    if(!r[field] || used['@'+r[field]]){
      seq[seqKey] = (Number(seq[seqKey])||0) + 1;
      r[field] = prefix + '-' + pad_(seq[seqKey], width);
      r.u = Math.max(Number(r.u||0) + 1, now); r.sv = ++SV;
      used[r[field]] = true;
    }
    used['@'+r[field]] = true;
  }
}
function renumber_(out){
  var seq = out.seq || {}, now = Date.now();

  function fix(list, prefixOf, seqKey, width, joiner){
    if(!list || !list.length) return;
    var rows = list.slice().sort(function(m,n){ return (Number(m.u||0))-(Number(n.u||0)); });
    var used = {}, i, r, pre, num;
    for(i=0;i<rows.length;i++){                       /* keep what is already unique */
      r = rows[i]; pre = prefixOf(r);
      if(r.code && !used[r.code]){
        used[r.code] = true;
        num = Number(String(r.code).split('-').pop()) || 0;
        var k1 = seqKey(pre);
        if(num > (Number(seq[k1])||0)) seq[k1] = num;
      }
    }
    for(i=0;i<rows.length;i++){                       /* then settle the clashes */
      r = rows[i]; pre = prefixOf(r);
      var k2 = seqKey(pre);
      if(!r.code || used[r.code] !== true || used['@'+r.code]){
        seq[k2] = (Number(seq[k2])||0) + 1;
        r.code = pre + joiner + pad_(seq[k2], width);
        r.u = Math.max(Number(r.u||0) + 1, now);   /* never behind the phone's own clock */
        r.sv = ++SV;
        used[r.code] = true;
      }
      used['@'+r.code] = true;                        /* this id has now claimed it */
    }
  }

  fix(out.customers,
      function(c){ var t=String(c.code||'R').charAt(0); return 'RWHC'.indexOf(t)<0 ? 'R' : t; },
      function(pre){ return pre; }, 4, '-');

  fix(out.orders,  function(){ return 'ORD'; },    function(){ return 'order'; }, 4, '-');

  /* bill and receipt numbers are printed for customers - they must be unique */
  var withInv = [];
  for(var oi=0; oi<(out.orders||[]).length; oi++) if(out.orders[oi].invNo) withInv.push(out.orders[oi]);
  fixNum_(withInv, 'invNo', 'INV', 'inv', 4, seq);
  var withRcp = [];
  for(var pi=0; pi<(out.payments||[]).length; pi++) if(out.payments[pi].rcpNo) withRcp.push(out.payments[pi]);
  fixNum_(withRcp, 'rcpNo', 'RCP', 'rcp', 4, seq);
  fix(out.sellers, function(s){ return String(s.code||'person').split('-')[0]; },
      function(){ return 'person'; }, 3, '-');

  out.seq = seq;
}
function mergeList_(x,y,tomb){
  var map = {}, order = [], was = {}, now = Date.now();
  function add(r){
    if(!r || !r.id) return;
    if(!r.u) r.u = now;                                              /* never leave one unstamped */
    if(tomb[r.id] && Number(tomb[r.id]) >= Number(r.u||0)) return;   /* deleted */
    if(!map[r.id]){ map[r.id] = r; order.push(r.id); }
    else if(Number(r.u||0) > Number(map[r.id].u||0)) map[r.id] = r;  /* newer wins */
  }
  for(var i=0;i<x.length;i++){ was[x[i].id] = x[i]; add(x[i]); }
  for(var j=0;j<y.length;j++) add(y[j]);
  var out = [];
  for(var q=0;q<order.length;q++){
    var id = order[q], win = map[id], old = was[id];
    /* only a record that actually moved gets a new counter value, so phones
       are not made to re-download the whole book on every sync */
    if(!old || Number(old.u||0) !== Number(win.u||0) || !win.sv) win.sv = ++SV;
    out.push(win);
  }
  return out;
}
function maxSeq_(a,b){
  a = a||{}; b = b||{};
  var o = {}, k;
  for(k in a) o[k] = Number(a[k])||0;
  for(k in b) o[k] = Math.max(o[k]||0, Number(b[k])||0);
  return o;
}

/* ---------- the tabs you read ---------- */
function writeTabs_(ss,d){
  function nm_(id){ for(var i=0;i<(d.sellers||[]).length;i++) if(d.sellers[i].id===id) return d.sellers[i].name; return ''; }
  function cd_(id){ for(var i=0;i<(d.sellers||[]).length;i++) if(d.sellers[i].id===id) return d.sellers[i].code; return ''; }

  upsert_(ss,'Customers',['ID','Cust ID','Name','Mobile','Type','Address','Added by'],
    (d.customers||[]).map(function(c){
      return [c.id,c.code,c.name,c.mobile||'',(c.code||'').charAt(0),c.address||'',nm_(c.byId||c.sellerId)]; }));

  upsert_(ss,'SalesPeople',['ID','Person ID','Name','Mobile'],
    (d.sellers||[]).map(function(s){ return [s.id,s.code,s.name,s.mobile||'']; }));

  upsert_(ss,'Produce',['ID','Name','Unit','Price list','Retail price','Wholesale price','Cost','Stock brought in','Low stock alert'],
    (d.products||[]).map(function(p){
      var L = (p.prices && p.prices.length) ? p.prices : [{label:'Retail',amt:p.rate||0}];
      function amt(nm){ for(var i=0;i<L.length;i++) if(String(L[i].label).toLowerCase()===nm) return L[i].amt; return ''; }
      var txt = L.map(function(x){ return x.label+' '+x.amt; }).join(' | ');
      return [p.id,p.name,p.unit,txt,amt('retail'),amt('wholesale'),p.cost,p.stock,p.low]; }));

  var orows = [];
  (d.orders||[]).forEach(function(o){
    var c = byId_(d.customers||[],o.custId), s = byId_(d.sellers||[],o.sellerId);
    (o.items||[]).forEach(function(it,j){
      orows.push([o.id+'#'+j, o.code, o.date, o.deliveryDate||'', o.invNo||'',
        c.code||'', c.name||'', c.mobile||'', s.name||'', s.code||'',
        it.name, it.qty, it.unit, it.rate, (it.custom?'Typed':(it.plabel||'')), it.qty*it.rate,
        o.shipMode||'', o.shipFee||0, o.pincode||'', o.city||'', o.address||'', o.status]);
    });
  });
  upsert_(ss,'Orders',['ID','Order','Order date','Expected delivery','Bill no',
    'Cust ID','Customer','Mobile','Sold by','Sold by ID',
    'Item','Qty','Unit','Price','Price used','Amount',
    'Delivery','Shipping','Pincode','City','Address','Status'], orows);

  upsert_(ss,'Payments',['ID','Receipt no','Date','Cust ID','Customer','Amount','Mode','Received by','Person ID'],
    (d.payments||[]).map(function(p){ var c=byId_(d.customers||[],p.custId);
      return [p.id,p.rcpNo||'',p.date,c.code||'',c.name||'',p.amount,p.mode,nm_(p.byId),cd_(p.byId)]; }));

  upsert_(ss,'Expenses',['ID','Date','Category','Amount','Mode','Note','Spent by','Person ID'],
    (d.expenses||[]).map(function(x){ return [x.id,x.date,x.cat,x.amount,x.mode,x.note||'',nm_(x.byId),cd_(x.byId)]; }));

  /* A live "what is left right now" tab, worked out the same way the app
     does it: everything brought in, minus delivered, minus promised. */
  var qty_ = function(pid,status){
    var t = 0;
    (d.orders||[]).forEach(function(o){
      if(status ? o.status!==status : o.status==='Cancelled') return;
      (o.items||[]).forEach(function(it){ if(it.pid===pid) t += Number(it.qty)||0; });
    });
    return Math.round(t*100)/100;
  };
  upsert_(ss,'Stock Now',['ID','Produce','Unit','Brought in','Delivered','In godown',
                          'Promised (not delivered)','FREE TO SELL','Low stock alert','Cost each','Value of free stock'],
    (d.products||[]).map(function(p){
      var inn = Number(p.stock)||0,
          del = qty_(p.id,'Delivered'),
          pro = qty_(p.id,'Pending'),
          god = Math.round((inn-del)*100)/100,
          free= Math.round((inn-del-pro)*100)/100;
      return [p.id, p.name, p.unit, inn, del, god, pro, free,
              (p.low==null?10:p.low), p.cost||0,
              Math.round(Math.max(0,free)*(Number(p.cost)||0)*100)/100]; }));

  upsert_(ss,'Stock',['ID','Date','Produce','Change','Unit','What happened','Why','Note','Recorded by'],
    (d.stockLogs||[]).map(function(g){
      return [g.id,g.date,g.name,g.qty,g.unit||'',g.kind||'',g.why||'',g.note||'',nm_(g.byId)||g.who||'']; }));
}

function byId_(list,id){
  for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i];
  return {};
}
/* Adds new rows, updates changed ones, and clears rows that are gone.
   Matches on the ID in column A. Do not delete or re-order column A. */
function norm_(v){
  if(v instanceof Date){
    var p=function(n){ return (n<10?'0':'')+n; };
    return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  }
  return String(v===null||v===undefined ? '' : v);
}
function sameRow_(a,b){
  if(a.length!==b.length) return false;
  for(var i=0;i<a.length;i++) if(norm_(a[i])!==norm_(b[i])) return false;
  return true;
}
function upsert_(ss,name,head,rows){
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if(sh.getLastRow()===0){
    sh.getRange(1,1,1,head.length).setValues([head]).setFontWeight('bold');
    sh.setFrozenRows(1);
  } else {
    /* an upgrade may add columns - keep the header honest */
    var cur0 = sh.getRange(1,1,1,head.length).getValues()[0];
    if(!sameRow_(cur0, head)) sh.getRange(1,1,1,head.length).setValues([head]).setFontWeight('bold');
  }
  var keep = {};
  for(var r=0;r<rows.length;r++) keep[String(rows[r][0])] = rows[r];

  var last = sh.getLastRow(), seen = {};
  if(last>1){
    var cur = sh.getRange(2,1,last-1,head.length).getValues();
    var blank = [];
    for(var i=0;i<head.length;i++) blank.push('');
    for(var c=0;c<cur.length;c++){
      var k = String(cur[c][0]);
      if(k==='') continue;
      if(keep.hasOwnProperty(k)){
        seen[k] = true;
        if(!sameRow_(cur[c], keep[k]))
          sh.getRange(c+2,1,1,head.length).setValues([keep[k]]);
      }else{
        sh.getRange(c+2,1,1,head.length).setValues([blank]);   /* deleted elsewhere */
      }
    }
  }
  var add = [];
  for(var r2=0;r2<rows.length;r2++) if(!seen[String(rows[r2][0])]) add.push(rows[r2]);
  if(add.length) sh.getRange(sh.getLastRow()+1,1,add.length,head.length).setValues(add);
}`;
  openSheet(head('Link a Google Sheet','One-time, about 3 minutes')+`

    <ol style="padding-left:20px;font-size:13.5px;line-height:1.7;margin:12px 0">

}

async function jsPDFready(){
  if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('pdf-unavailable');
  return window.jspdf.jsPDF;
}
/* Bill / receipt numbers are assigned once and never change or repeat. */
function invNoFor(o){ if(!o.invNo){ S.seq.inv=(S.seq.inv||0)+1; o.invNo='INV-'+pad(S.seq.inv,4); save(); } return o.invNo; }
function rcpNoFor(pm){ if(!pm.rcpNo){ S.seq.rcp=(S.seq.rcp||0)+1; pm.rcpNo='RCP-'+pad(S.seq.rcp,4); save(); } return pm.rcpNo; }

const GRN=[31,138,76], ORG=[214,106,6], GRY=[122,122,112], DRK=[35,38,31], LINE_=[232,232,224];
/* jsPDF's built-in font has no rupee glyph, so bills print "Rs". */
const rs=n=>'Rs '+Math.round(Number(n)||0).toLocaleString('en-IN');

function pdfHead(d,title,right){
  d.setFont('helvetica','bold'); d.setFontSize(17); d.setTextColor.apply(d,GRN);
  d.text(S.farm.name||'My Farm',14,20);
  d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor.apply(d,GRY);
  let y=26;
  if(S.farm.mobile){ d.text('Mobile: '+S.farm.mobile,14,y); y+=4.6; }
  if(S.farm.upi){ d.text('UPI: '+S.farm.upi,14,y); y+=4.6; }
  d.setFont('helvetica','bold'); d.setFontSize(15); d.setTextColor.apply(d,DRK);
  d.text(title,196,20,{align:'right'});
  d.setFont('helvetica','normal'); d.setFontSize(9.5); d.setTextColor.apply(d,GRY);
  let ry=26; right.filter(Boolean).forEach(t=>{ d.text(t,196,ry,{align:'right'}); ry+=4.6; });
  const top=Math.max(y,ry)+3;
  d.setDrawColor.apply(d,LINE_); d.setLineWidth(.5); d.line(14,top,196,top);
  return top+9;
}
function pdfFoot(d,isReceipt){
  d.setFont('helvetica','normal'); d.setFontSize(8.5); d.setTextColor.apply(d,GRY);
  if(!isReceipt) d.text('This is not a GST invoice.',14,284);
  d.text('Thank you for your business.',196,284,{align:'right'});
}

async function invoicePDF(orderId,share){
  let d;
  try{
    const J=await jsPDFready();
    const o=S.orders.find(x=>x.id===orderId); if(!o) return;
    const c=S.customers.find(x=>x.id===o.custId)||{}, sp=S.sellers.find(x=>x.id===o.sellerId);
    const no=invNoFor(o);
    d=new J({unit:'mm',format:'a4'});
    let y=pdfHead(d,'INVOICE',['Bill no: '+no,'Order: '+o.code,'Date: '+niceDate(o.date),
      o.deliveryDate?('Expected delivery: '+niceDate(o.deliveryDate)):'']);

    d.setFont('helvetica','bold'); d.setFontSize(9); d.setTextColor.apply(d,GRY); d.text('BILL TO',14,y);
    d.setFontSize(11.5); d.setTextColor.apply(d,DRK); d.text(String(c.name||'-'),14,y+6);
    d.setFont('helvetica','normal'); d.setFontSize(9.5); d.setTextColor.apply(d,GRY);
    let ay=y+11.5;
    [c.code?('Customer ID: '+c.code):'', c.mobile?('Mobile: '+c.mobile):'',
     [o.address,o.city,o.pincode].filter(Boolean).join(', ')||c.address||''
    ].filter(Boolean).forEach(l=>{ d.splitTextToSize(l,105).forEach(t=>{ d.text(t,14,ay); ay+=4.6; }); });
    let ry=y+6;
    d.text('Delivery: '+(o.shipMode||'Free home delivery'),196,ry,{align:'right'}); ry+=4.6;
    if(sp){ d.text('Sold by: '+sp.name+' ('+sp.code+')',196,ry,{align:'right'}); ry+=4.6; }
    y=Math.max(ay,ry)+5;

    d.setFillColor(240,243,236); d.rect(14,y,182,8.5,'F');
    d.setFont('helvetica','bold'); d.setFontSize(9); d.setTextColor.apply(d,DRK);
    d.text('ITEM',17,y+5.8); d.text('QTY',124,y+5.8,{align:'right'});
    d.text('PRICE',156,y+5.8,{align:'right'}); d.text('AMOUNT',193,y+5.8,{align:'right'});
    y+=8.5;
    d.setFont('helvetica','normal'); d.setFontSize(10);
    o.items.forEach(i=>{
      if(y>250){ d.addPage(); y=20; }
      d.setTextColor.apply(d,DRK);
      d.text(String(i.name).slice(0,44),17,y+5.8);
      d.text(String(i.qty)+' '+(i.unit||''),124,y+5.8,{align:'right'});
      d.text(rs(i.rate),156,y+5.8,{align:'right'});
      d.text(rs(i.qty*i.rate),193,y+5.8,{align:'right'});
      d.setDrawColor.apply(d,LINE_); d.setLineWidth(.3); d.line(14,y+8.5,196,y+8.5);
      y+=8.5;
    });

    /* add up the SAME rounded figures the customer can see in the column */
    const sub=o.items.reduce((a,i)=>a+Math.round(i.qty*i.rate),0);
    const ship=Math.round(+o.shipFee||0);
    const tot=sub+ship;
    const stillDue=Math.round(orderDue(o));       /* oldest bill paid first */
    const already=Math.max(0,tot-stillDue);
    y+=7;
    const line=(lab,v,bold,col)=>{ d.setFont('helvetica',bold?'bold':'normal'); d.setFontSize(bold?11.5:10);
      d.setTextColor.apply(d,col||(bold?DRK:GRY)); d.text(lab,156,y,{align:'right'}); d.text(v,193,y,{align:'right'}); y+=6.2; };
    line('Items total','Rs '+sub.toLocaleString('en-IN'));
    if(ship) line('Shipping','Rs '+ship.toLocaleString('en-IN'));
    d.setDrawColor(205,205,195); d.setLineWidth(.5); d.line(124,y-4.2,196,y-4.2);
    line('TOTAL','Rs '+tot.toLocaleString('en-IN'),true);
    if(already>0 && stillDue>0) line('Already received','Rs '+already.toLocaleString('en-IN'),false,GRN);
    if(stillDue<=0) line('PAID IN FULL','',true,GRN);
    else {
      line('Please pay','Rs '+stillDue.toLocaleString('en-IN'),true,ORG);
      const bal=Math.max(0,dues(o.custId));
      if(bal && Math.abs(bal-stillDue)>1){ d.setFontSize(9); d.setTextColor.apply(d,GRY);
        d.text('Total outstanding on your account: '+rs(bal),193,y,{align:'right'}); y+=6; }
    }
    if(S.farm.upi){ d.setFont('helvetica','normal'); d.setFontSize(9.5); d.setTextColor.apply(d,GRY);
      d.text('Pay by UPI: '+S.farm.upi,14,y+2); }
    pdfFoot(d);
    await outPDF(d,(no+'-'+String(c.name||'bill').replace(/[^A-Za-z0-9]/g,'_')+'.pdf'),share);
  }catch(e){ toast(e && e.message==='pdf-unavailable' ? 'Needs internet the first time' : 'Could not make the PDF'); }
}

/* Share straight to WhatsApp where the phone allows it, else save the file. */
async function outPDF(d,filename,share){
  const blob=d.output('blob');
  if(share && navigator.canShare && navigator.share){
    try{
      const f=new File([blob],filename,{type:'application/pdf'});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  const dls=await getDL();
  if(dls && dls.save){
    try{ await dls.save({filename:filename,data:blob}); toast('Saved ✅'); }
    catch(e){ toast('Saving not allowed here'); }
    return;
  }
  try{ d.save(filename); toast('PDF ready ✅'); }catch(e){ toast('Could not save the PDF'); }
}

/* Saves the file. Opened as a normal HTML file → ordinary browser download.
   Viewed on a hosted preview → asks the viewer through the host instead. */
let DLNS=null, dlAsked=false;
async function getDL(){ if(dlAsked) return DLNS; dlAsked=true;
  try{ if(window.claude && window.claude.use) DLNS=await window.claude.use('downloads'); }catch(e){ DLNS=null; }
  return DLNS; }
async function dl(name,text,type){
  const d=await getDL();
  if(d && d.save){
    try{ await d.save({filename:name,data:text}); toast('Saved ✅'); }
    catch(e){ toast('Download not allowed here'); }
    return;
  }
  try{
    const b=new Blob([text],{type:type||'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    toast('Downloaded ✅');
  }catch(e){ toast('Could not download here'); }
}

/* ---- swipe down at the top of a screen to refresh ---- */
(function pullToRefresh(){
  const ind=document.createElement('div'); ind.className='ptr'; ind.textContent='↓ Pull to refresh';
  document.body.appendChild(ind);
  let y0=null, dy=0;
  const atTop=()=>(window.scrollY||document.documentElement.scrollTop||0)<=2;
  window.addEventListener('touchstart',e=>{
    y0=(atTop() && !mask.classList.contains('open') && e.touches.length===1)?e.touches[0].clientY:null; dy=0;
  },{passive:true});
  window.addEventListener('touchmove',e=>{
    if(y0==null) return;
    dy=e.touches[0].clientY-y0;
    if(dy>10){ ind.classList.add('on'); ind.style.transform='translate(-50%,'+Math.min(dy*0.4,34)+'px)';
      ind.textContent=dy>70?'Release to refresh':'↓ Pull to refresh'; }
  },{passive:true});
  window.addEventListener('touchend',()=>{
    const go=(y0!=null&&dy>70);
    ind.classList.remove('on'); ind.style.transform=''; y0=null; dy=0;
    if(go) syncNow(true);
  });
})();
